<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SGC Arabia · WPS Payroll Files</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink:#16202b; --mute:#5f6b78; --line:#d9dee4; --bg:#f3f1ec; --card:#fff; --accent:#0b5d4b; --accent2:#e5f1ed; --err:#b3261e; --errbg:#fbeceb; --warn:#8a5a00; --warnbg:#fdf4dd; --new:#1b4f9c; --newbg:#e8f0fb; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 "Segoe UI","Malgun Gothic",system-ui,sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--ink); color:#fff; padding:14px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; font-weight:600; letter-spacing:.2px; }
  header .sp { flex:1; }
  header .store { font-size:12.5px; color:#c9d3dc; }
  header .store b { color:#fff; }
  nav { background:#fff; border-bottom:1px solid var(--line); padding:0 24px; display:flex; gap:4px; }
  nav button { border:0; background:none; padding:12px 14px; font:inherit; color:var(--mute); cursor:pointer; border-bottom:3px solid transparent; }
  nav button.on { color:var(--ink); font-weight:600; border-bottom-color:var(--accent); }
  main { max-width:1180px; margin:0 auto; padding:20px 24px 80px; }
  section.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:18px 20px; margin-bottom:16px; }
  h2 { font-size:15px; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
  h2 .step { background:var(--ink); color:#fff; width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:12px; }
  p.hint { color:var(--mute); margin:4px 0 12px; font-size:13px; }
  button.btn { font:inherit; border:1px solid var(--line); background:#fff; border-radius:6px; padding:7px 13px; cursor:pointer; }
  button.btn:hover { border-color:#9aa5b1; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; padding:10px 20px; }
  button.primary:disabled { background:#a9b7b3; border-color:#a9b7b3; cursor:not-allowed; }
  button.link { border:0; background:none; color:var(--accent); cursor:pointer; padding:0; font:inherit; text-decoration:underline; }
  header button.btn { background:transparent; color:#fff; border-color:#4a5866; padding:5px 11px; font-size:12.5px; }
  input[type=text], input[type=month], input[type=date], input[type=search], select { font:inherit; border:1px solid var(--line); border-radius:5px; padding:6px 8px; background:#fff; }
  input.cell { width:100%; padding:4px 6px; }
  .row { display:flex; gap:20px; flex-wrap:wrap; align-items:flex-end; }
  .row label { display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--mute); }
  .drop { border:2px dashed #b9c2cc; border-radius:8px; padding:26px; text-align:center; color:var(--mute); background:#fafaf8; cursor:pointer; }
  .drop.over { border-color:var(--accent); background:var(--accent2); color:var(--ink); }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th { text-align:left; font-weight:600; color:var(--mute); font-size:12px; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:6px 8px; border-bottom:1px solid #edf0f3; vertical-align:middle; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  td.mono { font-family:Consolas,"SFMono-Regular",monospace; font-size:12.5px; }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:600; white-space:nowrap; }
  .tag.ok { background:var(--accent2); color:var(--accent); } .tag.err { background:var(--errbg); color:var(--err); } .tag.warn { background:var(--warnbg); color:var(--warn); } .tag.new { background:var(--newbg); color:var(--new); }
  .box { border-radius:6px; padding:10px 14px; margin:10px 0; font-size:13px; }
  .box.err { background:var(--errbg); border-left:4px solid var(--err); } .box.warn { background:var(--warnbg); border-left:4px solid var(--warn); } .box.new { background:var(--newbg); border-left:4px solid var(--new); } .box.ok { background:var(--accent2); border-left:4px solid var(--accent); }
  .box h3 { margin:0 0 6px; font-size:13.5px; }
  .box ul { margin:4px 0 0; padding-left:18px; }
  .total { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
  .muted { color:var(--mute); } .small { font-size:12px; }
  .scroll { max-height:460px; overflow:auto; border:1px solid var(--line); border-radius:6px; }
  .scroll th { position:sticky; top:0; background:#fff; }
  details summary { cursor:pointer; color:var(--accent); }
  .hide { display:none !important; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:6px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:80vw; }
  #toast.on { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>SGC Arabia · WPS Payroll Files</h1>
  <span class="sp"></span>
  <span class="store" id="storeInfo"></span>
  <button class="btn" id="btnFolder"></button>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="toast"></div>
<script src="xlsbin.js"></script>
<script src="wps.js"></script>
<script src="app.js"></script>
</body>
</html>
